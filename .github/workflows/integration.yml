name: Integration Tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'Iniciativas-Alexendros'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project

      - run: pnpm run build

      - run: pnpm run test:integration
        env:
          PROTON_INTEGRATION_TEST: 'true'
          PROTON_BRIDGE_USER: ${{ secrets.PROTON_BRIDGE_USER }}
          PROTON_BRIDGE_PASS: ${{ secrets.PROTON_BRIDGE_PASS }}
          PROTON_BRIDGE_HOST: '127.0.0.1'
          PROTON_BRIDGE_IMAP_PORT: '1143'
          PROTON_BRIDGE_SMTP_PORT: '1025'
          PROTON_BRIDGE_TLS_INSECURE: 'true'
