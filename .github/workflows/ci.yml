name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm run coverage

      - name: Verify badge matches coverage
        run: pnpm run coverage:check

      - name: Build
        run: pnpm run build

      - name: Generate MCP tools reference
        run: pnpm run docs:generate

      - name: Verify docs/api/mcp-tools.md is in sync
        run: pnpm run docs:check

      - name: Contract tests (MCP tool surface — no GreenMail needed)
        run: pnpm run test:contract

      - name: Smoke test (stdio initialize + tools/list)
        run: pnpm run smoke

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Critical vulnerabilities only
        run: pnpm audit --audit-level=critical

  e2e:
    name: E2E (GreenMail · IMAP/SMTP reales)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      greenmail:
        image: greenmail/standalone:2.1.0
        ports:
          - 3025:3025
          - 3143:3143
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Wait for GreenMail IMAP (127.0.0.1:3143)
        run: |
          if ! docker ps 2>/dev/null | grep -q greenmail; then
            echo "::warning::GreenMail container not detected (Docker service may not work on this runner)"
          fi
          for i in $(seq 1 60); do
            if nc -z localhost 3143 2>/dev/null; then
              echo "GreenMail listo (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "::error::GreenMail no respondió en :3143 tras 120s. Verifica que Docker service containers están habilitados en el runner."
          docker ps 2>/dev/null || echo "::warning::Docker not available on runner"
          exit 1
      - name: Install pass + gnupg (needed by pass.e2e.ts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pass gnupg netcat-openbsd
      - name: E2E full cycle (send → read → flag → move → delete)
        id: e2e
        env:
          GREENMAIL_HOST: 127.0.0.1
          GREENMAIL_IMAP_PORT: '3143'
          GREENMAIL_SMTP_PORT: '3025'
        run: pnpm run test:e2e
      - name: Report E2E result (non-gating)
        if: always()
        run: |
          if [[ "${{ steps.e2e.outcome }}" == "success" ]]; then
            echo "✅ E2E GreenMail: all assertions green." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ E2E GreenMail failed (non-gating). See logs above." >> $GITHUB_STEP_SUMMARY
          fi

  e2e-pass:
    name: E2E (Pass · GPG + pass CLI reales)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Install pass + gnupg (E2E)
        run: |
          if ! command -v pass &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq pass gnupg netcat-openbsd
          fi
      - id: e2e_pass
        run: bash scripts/e2e-pass.sh
      - name: Report E2E-pass result (non-gating)
        if: always()
        run: |
          if [[ "${{ steps.e2e_pass.outcome }}" == "success" ]]; then
            echo "✅ E2E Pass (GPG): all green." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ E2E Pass failed (non-gating). See logs above." >> $GITHUB_STEP_SUMMARY
          fi

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: protonsuite-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
