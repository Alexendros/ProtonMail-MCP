# ---------------------------------------------------------------------------
# Setup project — composite action
#
# DRY de los 4 steps repetidos en ci.yml, quality.yml (knip), integration.yml
# y coverage-badge.yml: checkout + setup-node + pnpm/action-setup + install.
#
# Security posture: NO pnpm store cache. El repo deliberadamente evita caching
# (zizmor `cache-poisoning` en PRs de fork + postura de supply-chain en
# release.yml). Se mantiene sin cache aquí para no introducir regressions.
# Renovate (github-actions manager) mantiene actualizados los SHAs pinneados.
# ---------------------------------------------------------------------------
name: Setup project
description: Checkout, set up Node.js + pnpm, install dependencies (frozen lockfile).

inputs:
  node-version:
    description: Node.js version to set up.
    required: false
    default: "22"
  pnpm-version:
    description: pnpm version ('latest' by default).
    required: false
    default: "latest"
  install-args:
    description: Extra args for `pnpm install` (e.g. --frozen-lockfile).
    required: false
    default: "--frozen-lockfile"

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Install dependencies
      shell: bash
      run: pnpm install ${{ inputs.install-args }}
